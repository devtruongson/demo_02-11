<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sử Học Số — Kho tư liệu Lịch sử 10</title>
  <style>
    :root {
      --navy: #243866;
      --navy2: #334b83;
      --gold: #e6ad4c;
      --ink: #202d49;
      --muted: #6c7890;
      --bg: #f6f8fc;
      --line: #e6eaf2;
      --white: #fff;
      --soft: #eef2fa;
      --shadow: 0 8px 24px rgba(31, 48, 86, .08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, "Be Vietnam Pro", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
    }

    button,
    input,
    select,
    textarea {
      font: inherit
    }

    button {
      cursor: pointer
    }

    a {
      color: inherit;
      text-decoration: none
    }

    .topbar {
      height: 76px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 20
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 230px
    }

    .brandmark {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #eaf0fc;
      display: grid;
      place-items: center;
      color: var(--navy);
      font-size: 25px
    }

    .brandname {
      font-weight: 800;
      font-size: 19px;
      letter-spacing: -.4px;
      color: var(--navy)
    }

    .brandtag {
      font-size: 11px;
      color: var(--muted);
      margin-top: 3px
    }

    .topnav {
      display: flex;
      gap: 7px;
      align-items: center
    }

    .navbtn,
    .iconbtn {
      border: 0;
      background: transparent;
      padding: 11px 13px;
      border-radius: 12px;
      color: #4b5875;
      font-weight: 600;
      font-size: 13px
    }

    .navbtn:hover,
    .navbtn.active {
      background: #edf1fb;
      color: var(--navy)
    }

    .iconbtn {
      font-size: 18px;
      border: 1px solid var(--line);
      width: 42px;
      height: 42px;
      padding: 0
    }

    .layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      min-height: calc(100vh - 76px)
    }

    .sidebar {
      padding: 24px 14px;
      border-right: 1px solid var(--line);
      background: #fff
    }

    .side-label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #9aa4b8;
      font-weight: 800;
      padding: 12px 12px 8px
    }

    .sidebtn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 13px;
      border-radius: 12px;
      margin: 3px 0;
      color: #58647d;
      font-size: 13px;
      font-weight: 600;
      border: 0;
      background: transparent;
      width: 100%;
      text-align: left
    }

    .sidebtn .ico {
      width: 23px;
      text-align: center;
      font-size: 17px
    }

    .sidebtn.active,
    .sidebtn:hover {
      background: #edf1fb;
      color: var(--navy)
    }

    .side-note {
      margin: 28px 4px 0;
      padding: 15px;
      background: #fff7e9;
      border: 1px solid #f6e7c9;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.55;
      color: #755b2e
    }

    main {
      padding: 26px clamp(18px, 3vw, 42px) 50px;
      min-width: 0;
      max-width: 1600px;
      width: 100%;
      margin: auto
    }

    .hero {
      min-height: 220px;
      border-radius: 22px;
      background: linear-gradient(100deg, rgba(27, 43, 79, .92), rgba(40, 65, 113, .62)), url('https://images.unsplash.com/photo-1564399579883-451a5d44ec08?auto=format&fit=crop&w=1800&q=85') center/cover;
      color: #fff;
      padding: 32px 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: var(--shadow)
    }

    .hero-copy {
      max-width: 680px
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 1.7px;
      text-transform: uppercase;
      color: #f5d79a;
      font-weight: 800
    }

    .hero h1 {
      font-size: clamp(26px, 3vw, 40px);
      line-height: 1.13;
      letter-spacing: -1px;
      margin: 12px 0
    }

    .hero p {
      color: #e5eaf5;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 20px
    }

    .searchbox {
      background: #fff;
      border-radius: 14px;
      padding: 6px;
      display: flex;
      align-items: center;
      max-width: 600px;
      box-shadow: 0 5px 20px #18284930
    }

    .searchbox span {
      padding: 0 12px;
      color: #6e7890;
      font-size: 18px
    }

    .searchbox input {
      border: 0;
      outline: 0;
      flex: 1;
      min-width: 0;
      padding: 10px 0;
      color: var(--ink);
      font-size: 13px
    }

    .searchbox button {
      border: 0;
      border-radius: 10px;
      background: var(--gold);
      color: #2b3550;
      font-weight: 800;
      padding: 11px 15px
    }

    .hero-badge {
      font-size: 90px;
      opacity: .28;
      margin: 0 4vw 0 20px
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin: 30px 0 15px
    }

    .section-head h2 {
      font-size: 19px;
      margin: 0;
      letter-spacing: -.4px
    }

    .section-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px
    }

    .textlink {
      border: 0;
      background: transparent;
      color: var(--navy2);
      font-size: 12px;
      font-weight: 800
    }

    .topic-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px
    }

    .topic-card {
      position: relative;
      min-height: 145px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #fff;
      box-shadow: 0 4px 12px #1c315009;
      cursor: pointer;
      transition: .18s
    }

    .topic-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow)
    }

    .topic-card img {
      width: 100%;
      height: 95px;
      object-fit: cover;
      display: block
    }

    .topic-card .topic-title {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.35;
      padding: 10px 11px 12px
    }

    .topic-num {
      position: absolute;
      top: 8px;
      left: 8px;
      background: #ffffffeb;
      color: var(--navy);
      border-radius: 8px;
      padding: 4px 7px;
      font-size: 10px;
      font-weight: 800
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px
    }

    .quick-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: 16px;
      display: flex;
      gap: 12px;
      align-items: center
    }

    .quick-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #eef2fb;
      display: grid;
      place-items: center;
      font-size: 20px
    }

    .quick-card strong {
      font-size: 13px;
      display: block
    }

    .quick-card small {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      display: block;
      margin-top: 4px
    }

    .page-head {
      border-radius: 20px;
      padding: 26px 30px;
      color: white;
      background: linear-gradient(100deg, #263c70, #536fba);
      position: relative;
      overflow: hidden;
      margin-bottom: 20px
    }

    .page-head:after {
      content: "⌂";
      position: absolute;
      right: 40px;
      top: -22px;
      font-size: 150px;
      opacity: .08
    }

    .breadcrumb {
      font-size: 11px;
      color: #e1e8f8;
      margin-bottom: 12px
    }

    .page-head h1 {
      font-size: 27px;
      margin: 0 0 8px;
      position: relative;
      z-index: 1
    }

    .page-head p {
      font-size: 13px;
      color: #e1e8f8;
      margin: 0;
      position: relative;
      z-index: 1
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 18px 0;
      flex-wrap: wrap
    }

    .toolbar .searchbox {
      flex: 1;
      min-width: 220px;
      border: 1px solid var(--line);
      box-shadow: none
    }

    .filter-select {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px;
      background: #fff;
      color: var(--ink);
      font-size: 12px
    }

    .pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0 20px
    }

    .pill {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 11px;
      padding: 10px 14px;
      color: #5c6880;
      font-size: 12px;
      font-weight: 700
    }

    .pill.active,
    .pill:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff
    }

    .resource-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px
    }

    .resource-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      overflow: hidden;
      box-shadow: 0 4px 15px #21365d08;
      transition: .18s
    }

    .resource-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow)
    }

    .resource-image {
      height: 180px;
      position: relative;
      background: #e9edf5
    }

    .resource-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .type-badge {
      position: absolute;
      top: 11px;
      right: 11px;
      background: #fffffff0;
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 800;
      color: var(--navy)
    }

    .play-mark {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font-size: 42px;
      text-shadow: 0 2px 10px #0008
    }

    .resource-body {
      padding: 14px
    }

    .resource-body h3 {
      font-size: 14px;
      line-height: 1.4;
      margin: 0 0 7px
    }

    .resource-body p {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 12px;
      min-height: 35px
    }

    .meta {
      font-size: 10px;
      color: #7d879a;
      margin-bottom: 12px
    }

    .card-actions {
      display: flex;
      gap: 8px
    }

    .primary-btn,
    .secondary-btn {
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 11px;
      font-weight: 800;
      border: 1px solid var(--line)
    }

    .primary-btn {
      background: #edf2ff;
      border-color: #dbe4fb;
      color: var(--navy)
    }

    .secondary-btn {
      background: #fff;
      color: #5c6880
    }

    .lesson-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(250px, .8fr);
      gap: 18px
    }

    .panel {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 20px;
      margin-bottom: 16px
    }

    .panel h2 {
      font-size: 16px;
      margin: 0 0 12px
    }

    .panel p,
    .panel li {
      font-size: 13px;
      line-height: 1.7;
      color: #5f6b83
    }

    .highlight {
      padding: 13px 15px;
      background: #fff7e9;
      border-radius: 12px;
      color: #755b2e;
      font-size: 12px;
      line-height: 1.6
    }

    .lesson-image {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px
    }

    .lesson-tabs {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin: 16px 0
    }

    .lesson-tabs button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      background: #e9edf5;
      color: #4d5b79;
      font-weight: 700;
      font-size: 12px
    }

    .lesson-tabs button.active {
      background: var(--navy);
      color: #fff
    }

    .empty {
      grid-column: 1/-1;
      background: #fff;
      border: 1px dashed #ccd4e4;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      color: var(--muted);
      font-size: 13px
    }

    footer {
      margin-top: 38px;
      border-top: 1px solid var(--line);
      padding: 22px 0;
      color: #8791a4;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #101a30a8;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50
    }

    .modal-backdrop.open {
      display: flex
    }

    .modal {
      background: #fff;
      border-radius: 20px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      box-shadow: 0 20px 80px #0003
    }

    .modal img {
      width: 100%;
      height: 100%;
      min-height: 340px;
      max-height: 600px;
      object-fit: cover;
      background: #e9edf5
    }

    .modal-content {
      padding: 28px
    }

    .modal-content h2 {
      font-size: 23px;
      margin: 10px 0
    }

    .modal-content p {
      font-size: 13px;
      color: #5d6980;
      line-height: 1.7
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .close {
      border: 0;
      background: #f0f2f7;
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 20px
    }

    .modal-label {
      display: inline-block;
      background: #eef2fb;
      color: var(--navy);
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800
    }

    .source-box {
      background: #f7f8fb;
      border-radius: 12px;
      padding: 13px;
      font-size: 12px;
      line-height: 1.6;
      margin: 15px 0
    }

    .source-box input {
      width: 100%;
      border: 1px solid #dce2ee;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      font-size: 11px
    }

    .edit-hint {
      font-size: 11px;
      color: #8993a7;
      margin-top: 10px
    }

    @media(max-width:1100px) {
      .topic-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .resource-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .topnav .navbtn {
        display: none
      }

      .hero-badge {
        display: none
      }
    }

    @media(max-width:700px) {
      .topbar {
        padding: 0 14px;
        height: 66px
      }

      .brand {
        min-width: 0
      }

      .brandname {
        font-size: 16px
      }

      .layout {
        grid-template-columns: 1fr
      }

      .sidebar {
        display: flex;
        overflow-x: auto;
        padding: 8px;
        gap: 4px;
        border-right: 0;
        border-bottom: 1px solid var(--line)
      }

      .side-label,
      .side-note {
        display: none
      }

      .sidebtn {
        white-space: nowrap;
        width: auto;
        padding: 10px
      }

      .sidebtn .ico {
        display: none
      }

      main {
        padding: 16px 13px 30px
      }

      .hero {
        padding: 25px 20px;
        min-height: 230px
      }

      .hero h1 {
        font-size: 28px
      }

      .topic-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px
      }

      .quick-grid {
        grid-template-columns: 1fr
      }

      .resource-grid {
        grid-template-columns: 1fr
      }

      .resource-image {
        height: 210px
      }

      .lesson-layout {
        grid-template-columns: 1fr
      }

      .page-head {
        padding: 22px
      }

      .page-head h1 {
        font-size: 22px
      }

      .modal {
        grid-template-columns: 1fr
      }

      .modal img {
        min-height: 220px;
        max-height: 300px
      }

      .modal-content {
        padding: 20px
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a href="#" class="brand" data-page="home">
      <div class="brandmark">⌂</div>
      <div>
        <div class="brandname">Sử Học Số</div>
        <div class="brandtag">Kho tư liệu Lịch sử 10</div>
      </div>
    </a>
    <nav class="topnav">
      <button class="navbtn active" data-page="home">Trang chủ</button>
      <button class="navbtn" data-page="topics">Chủ đề học tập</button>
      <button class="navbtn" data-page="library">Kho tư liệu</button>
      <button class="navbtn" data-page="teachers">Dành cho giáo viên</button>
      <button class="navbtn" data-page="students">Dành cho học sinh</button>
    </nav>
    <button class="iconbtn" id="editToggle" title="Bật chế độ chỉnh sửa">✎</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="side-label">Không gian học tập</div>
      <button class="sidebtn active" data-page="home"><span class="ico">⌂</span>Trang chủ</button>
      <button class="sidebtn" data-page="topics"><span class="ico">▦</span>Chủ đề</button>
      <button class="sidebtn" data-page="library"><span class="ico">▤</span>Kho tư liệu</button>
      <button class="sidebtn" data-page="teachers"><span class="ico">♧</span>Dành cho giáo viên</button>
      <button class="sidebtn" data-page="students"><span class="ico">♙</span>Dành cho học sinh</button>
      <button class="sidebtn" data-page="about"><span class="ico">ⓘ</span>Giới thiệu</button>
      <div class="side-note"><strong>💡 Mẹo sử dụng</strong><br>Nhập từ khóa để tìm tư liệu. Nhấn vào thẻ để xem thông
        tin chi tiết và nguồn tham khảo.</div>
    </aside>

    <main id="app"></main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal" id="modalContent"></div>
  </div>

  <script>
    const topics = [
      { id: 1, title: "Thế giới cổ đại", img: "https://images.unsplash.com/photo-1603565816030-6b389eeb23cb?auto=format&fit=crop&w=800&q=80", desc: "Những nền văn minh đầu tiên và di sản của thế giới cổ đại." },
      { id: 2, title: "Thế giới trung đại", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80", desc: "Các xã hội, nhà nước và thành tựu văn hóa thời trung đại." },
      { id: 3, title: "Một số nền văn minh châu Á", img: "https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=800&q=80", desc: "Khám phá những trung tâm văn minh lớn ở châu Á." },
      { id: 4, title: "Văn minh Đông Nam Á", img: "https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?auto=format&fit=crop&w=800&q=80", desc: "Di sản, giao lưu và thành tựu của các nền văn minh Đông Nam Á." },
      { id: 5, title: "Các cuộc cách mạng công nghiệp", img: "https://images.unsplash.com/photo-1516937941344-00b4e0337589?auto=format&fit=crop&w=800&q=80", desc: "Những chuyển biến về khoa học, công nghệ, kinh tế và xã hội." },
      { id: 6, title: "Thế giới hiện đại", img: "https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=800&q=80", desc: "Các biến đổi và vấn đề nổi bật của thế giới hiện đại." },
      { id: 7, title: "Việt Nam trong lịch sử thế giới", img: "https://images.unsplash.com/photo-1528127269322-539801943592?auto=format&fit=crop&w=800&q=80", desc: "Việt Nam trong dòng chảy lịch sử khu vực và thế giới." }

      const r = resources.find(x => x.id === id); if (!r) return;
      document.getElementById("modalContent").innerHTML = `<img src="${r.img}" alt="${esc(r.title)}"><div class="modal-content"><div class="modal-top"><span class="modal-label">${typeNames[r.type]}</span><button class="close" id="closeModal">×</button></div><h2>${esc(r.title)}</h2><p>${esc(r.desc)}</p><p><strong>Thời kỳ:</strong> ${esc(r.period || "Chưa xác định")}<br><strong>Địa điểm:</strong> ${esc(r.place || "Chưa xác định")}</p><div class="source-box"><strong>Thông tin nguồn</strong><br>${esc(r.source || "Chưa bổ sung")}<br>${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" style="color:#344d86;word-break:break-word">${esc(r.url)}</a>` : "<em>Chưa có đường dẫn nguồn — cần bổ sung trước khi công bố.</em>"}<div class="edit-hint">Chuyển sang chế độ chỉnh sửa để cập nhật tên, mô tả, nguồn và liên kết.</div></div><div class="highlight"><strong>Gợi ý khai thác</strong><br>${esc(r.tip || "Bổ sung câu hỏi khai thác tư liệu.")}</div><button class="primary-btn" id="editThisResource">✎ Chỉnh sửa tư liệu này</button></div>`;
      document.getElementById("modalBackdrop").classList.add("open");
      document.getElementById("closeModal").onclick = closeModal;
      document.getElementById("editThisResource").onclick = () => { closeModal(); openEditor(r.id); };
    }
    function closeModal() { document.getElementById("modalBackdrop").classList.remove("open"); }
    document.getElementById("modalBackdrop").addEventListener("click", e => { if (e.target.id === "modalBackdrop") closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
    function openEditor(id = null) {
      const r = id ? resources.find(x => x.id === id) : { id: null, topic: currentTopic || 4, lesson: "", type: "image", title: "", period: "", place: "", desc: "", source: "", url: "", img: "", tip: "" };
      document.getElementById("modalContent").innerHTML = `<div class="modal-content" style="grid-column:1/-1"><div class="modal-top"><span class="modal-label">CHẾ ĐỘ CHỈNH SỬA</span><button class="close" id="closeModal">×</button></div><h2>${id ? "Chỉnh sửa tư liệu" : "Thêm tư liệu mới"}</h2><p>Thay đổi thông tin bên dưới rồi lưu. Nội dung được lưu trong trình duyệt của thiết bị này.</p><form id="resourceForm"><div class="form-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px"><label style="font-size:12px;font-weight:700">Tên tư liệu<input required name="title" value="${esc(r.title)}" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700">Loại tư liệu<select name="type" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"><option value="image" ${r.type === "image" ? "selected" : ""}>Hình ảnh</option><option value="text" ${r.type === "text" ? "selected" : ""}>Văn bản</option><option value="video" ${r.type === "video" ? "selected" : ""}>Video</option></select></label><label style="font-size:12px;font-weight:700">Chủ đề<select name="topic" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px">${topics.map(t => `<option value="${t.id}" ${Number(r.topic) === t.id ? "selected" : ""}>${t.id}. ${esc(t.title)}</option>`).join("")}</select></label><label style="font-size:12px;font-weight:700">Bài học<input name="lesson" value="${esc(r.lesson)}" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700">Thời kỳ<input name="period" value="${esc(r.period)}" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700">Địa điểm<input name="place" value="${esc(r.place)}" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700;grid-column:1/-1">Mô tả<textarea name="desc" rows="2" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px">${esc(r.desc)}</textarea></label><label style="font-size:12px;font-weight:700;grid-column:1/-1">Đường dẫn ảnh/video<input name="img" value="${esc(r.img)}" placeholder="https://..." style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700;grid-column:1/-1">Tên nguồn<input name="source" value="${esc(r.source)}" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700;grid-column:1/-1">Đường dẫn nguồn<input name="url" value="${esc(r.url)}" placeholder="https://..." style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px"></label><label style="font-size:12px;font-weight:700;grid-column:1/-1">Gợi ý khai thác<textarea name="tip" rows="2" style="display:block;width:100%;padding:11px;border:1px solid #dce2ee;border-radius:9px;margin-top:6px">${esc(r.tip)}</textarea></label></div><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><button class="primary-btn" type="submit">Lưu tư liệu</button><button class="secondary-btn" type="button" id="cancelEdit">Hủy</button>${id ? '<button class="secondary-btn" type="button" id="deleteResource" style="color:#a33">Xóa tư liệu</button>' : ""}</div></form><p class="edit-hint">Lưu ý: đây là bản demo lưu dữ liệu cục bộ trên trình duyệt. Hãy xuất bản sao lưu JSON thường xuyên.</p></div>`;
      document.getElementById("modalBackdrop").classList.add("open");
      document.getElementById("closeModal").onclick = closeModal; document.getElementById("cancelEdit").onclick = closeModal;
      document.getElementById("resourceForm").onsubmit = e => {
        e.preventDefault(); const fd = new FormData(e.target); const data = Object.fromEntries(fd.entries()); data.id = id || Math.max(0, ...resources.map(x => x.id)) + 1; data.topic = Number(data.topic);
        if (!data.img.trim()) data.img = "https://images.unsplash.com/photo-1461360370896-922624d12aa1?auto=format&fit=crop&w=1200&q=80";
        if (id) { resources = resources.map(x => x.id === id ? data : x); } else resources.push(data);
        persist(); closeModal(); go("library");
      };
      const del = document.getElementById("deleteResource"); if (del) del.onclick = () => { if (confirm("Bạn có chắc muốn xóa tư liệu này?")) { resources = resources.filter(x => x.id !== id); persist(); closeModal(); go("library"); } };
    }
    function persist() { try { localStorage.setItem("sukyso_resources", JSON.stringify(resources)); } catch (e) { } }
    function loadSaved() { try { const s = localStorage.getItem("sukyso_resources"); if (s) { const parsed = JSON.parse(s); if (Array.isArray(parsed)) resources = parsed; } } catch (e) { } }
    document.getElementById("editToggle").onclick = () => { editMode = !editMode; document.getElementById("editToggle").textContent = editMode ? "✓" : "✎"; document.getElementById("editToggle").title = editMode ? "Thoát chế độ chỉnh sửa" : "Bật chế độ chỉnh sửa"; if (editMode) { openEditor(); } };
    loadSaved(); renderHome();
  </script>
</body>

</html>
